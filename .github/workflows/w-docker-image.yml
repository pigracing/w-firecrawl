name: Build and Run Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-run-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './apps/api'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build firecrawl
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./apps/api
          file: ./apps/api/Dockerfile   # 指定 Dockerfile 路径
          tags: ricebug/firecrawl:latest      
          
      - name: Build playwright-service
        uses: docker/build-push-action@v4
        with:
          push: true
          context: ./apps/playwright-service-ts
          file: ./apps/playwright-service-ts/Dockerfile   # 指定 Dockerfile 路径
          tags: ricebug/playwright-service:latest
